<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Royal Rangoli Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F4C54E;--gold2:#FFE08F;--panel:rgba(34,18,30,.9);--line:rgba(244,197,78,.28);--txt:#fbefdc;--muted:#d4bfa6;--hf:'Baloo 2','Poppins',system-ui,sans-serif;--bf:'Poppins',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a0f14;color:var(--txt);font-family:var(--bf)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;height:62px;display:flex;align-items:center;gap:12px;padding:0 18px;background:linear-gradient(180deg,rgba(26,12,20,.78),rgba(26,12,20,0));pointer-events:none}
#top>*{pointer-events:auto}
.brand .k{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:600;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand .t{font-family:var(--hf);font-size:26px;font-weight:800;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sp{flex:1}
.seg{display:flex;background:rgba(0,0,0,.38);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--gold);color:#2a1630}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;background:rgba(0,0,0,.38);backdrop-filter:blur(6px)}
#panel{position:fixed;right:14px;top:70px;bottom:14px;width:392px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#panel .pb{flex:1;overflow:auto;padding:14px 16px 18px}
#panel .pb::-webkit-scrollbar{width:7px}#panel .pb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:7px}
.sec{margin-bottom:14px}
.gl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 7px;display:flex;align-items:center;gap:8px}
.gl b{color:var(--gold2);letter-spacing:0;text-transform:none;font-size:12.5px;font-weight:600}
.namebox{display:flex;gap:8px}
.namebox input,.namebox select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;outline:none}
.namebox input{flex:1;min-width:0}
.namebox input:focus{border-color:var(--gold)}
.namebox select option{color:#222}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pre{border-radius:12px;overflow:hidden;border:2px solid transparent;background:#2a1a12;position:relative;aspect-ratio:1}
.pre img{width:100%;height:100%;display:block}
.pre span{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:700;padding:3px 2px;background:rgba(0,0,0,.6);text-align:center;line-height:1.15}
.pre.on{border-color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:center}
.tab.on{background:var(--gold);color:#2a1630;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
.chip.on{background:rgba(244,197,78,.2);border-color:var(--gold);color:var(--gold2)}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pal{border-radius:12px;padding:6px;background:rgba(255,255,255,.06);border:2px solid transparent;text-align:center}
.pal .sw{display:flex;height:18px;border-radius:6px;overflow:hidden}
.pal .sw i{flex:1}
.pal span{font-size:10.5px;font-weight:600;color:var(--muted);display:block;margin-top:3px}
.pal.on{border-color:var(--gold)}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0}
.sl label{font-size:12.5px;font-weight:600;width:96px;color:var(--muted)}
.sl input{flex:1;accent-color:#F4C54E}
.sl output{width:34px;text-align:right;font-family:var(--hf);font-weight:800;color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:13px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#FFD46B,#F0A92E);color:#2a1630;border:0;box-shadow:0 6px 18px rgba(240,169,46,.3)}
.row{display:flex;gap:7px}.row>.btn{flex:1}
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gal button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#2a1a12;border:1px solid rgba(255,255,255,.12)}
.gal img{width:100%;height:100%;display:block}
.gal .empty{display:grid;place-items:center;font-size:18px;color:rgba(255,255,255,.2)}
.maths{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:13px;background:linear-gradient(135deg,rgba(123,108,246,.2),rgba(232,67,111,.14));border:1px solid rgba(123,108,246,.4)}
.maths b{color:var(--gold2)}
#toast{position:fixed;left:calc((100% - 420px)/2);top:76px;transform:translateX(-50%);padding:10px 20px;border-radius:16px;background:rgba(26,12,20,.85);border:1px solid var(--line);font-family:var(--hf);font-size:20px;font-weight:700;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}
#toast.hide{opacity:0;transform:translateX(-50%) translateY(-8px)}

.pats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pat{border-radius:12px;padding:5px 3px 4px;background:rgba(255,255,255,.06);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.pat img{width:100%;max-width:70px;aspect-ratio:1;display:block}
.pat span{font-size:10px;font-weight:700;line-height:1.15;text-align:center;color:var(--muted)}
.pat.on{border-color:var(--gold);background:rgba(244,197,78,.14)}.pat.on span{color:var(--gold2)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:31px;height:31px;border-radius:50%;border:3px solid rgba(255,255,255,.15);transition:transform .12s}
.sw button.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(244,197,78,.5)}
.rule{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:13px;background:rgba(244,197,78,.1);border:1px solid rgba(244,197,78,.4)}
.rule b{color:var(--gold2)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.stats span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.25)}
.stats .bad{background:rgba(255,90,90,.25);color:#ffb3b3}
@media (max-width:1050px){#panel{width:330px}.pats{grid-template-columns:repeat(3,1fr)}#toast{left:calc((100% - 350px)/2)}}
</style>
</head>

</div>
<div id="toast" class="hide"></div>
<aside id="panel"><div class="pb" id="pb"></div></aside>

{ const g = grain.getContext('2d'), id = g.createImageData(300, 300); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random(); id.data[i] = id.data[i + 1] = id.data[i + 2] = v > .5 ? 255 : 0; id.data[i + 3] = Math.random() * 30; } g.putImageData(id, 0, 0); }

/* ---------------- actions ---------------- */

let AC = null; function tone(f, d, v = .08, type = 'sine', delay = 0) { if (!SOUND) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .05); } catch (e) { } }
